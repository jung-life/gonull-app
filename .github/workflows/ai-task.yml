name: AI Task Executor

on:
  issues:
    types: [labeled]

jobs:
  execute-task:
    if: github.event.label.name == 'ai-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mark issue as in-progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 Chintu is on it! Working on your idea now...'
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['in-progress']
            });

      - name: Run AI executor
        id: ai-executor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'claude' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_NAME: ${{ github.repository }}
        run: node .github/scripts/ai-executor.js

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = `ai-task/issue-${context.issue.number}`;

            // Check if there are changes to commit
            const { execSync } = require('child_process');
            const status = execSync('git status --porcelain').toString().trim();

            if (!status) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ No code changes were generated. The task may need more detail — try rephrasing your idea with more specifics.'
              });
              return;
            }

            execSync(`git config user.email "chintu-bot@gonull.app"`);
            execSync(`git config user.name "Chintu Bot"`);
            execSync(`git checkout -b ${branch}`);
            execSync('git add -A');
            execSync(`git commit -m "feat: ${process.env.ISSUE_TITLE}

Implements idea from issue #${context.issue.number}"`);
            execSync(`git push origin ${branch}`);

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `feat: ${context.payload.issue.title}`,
              body: `## What this does\n${context.payload.issue.body}\n\n## Source\nCloses #${context.issue.number}\n\n🤖 Generated by Chintu`,
              head: branch,
              base: 'main'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Done! Your idea is ready to review:\n\n👉 ${pr.data.html_url}`
            });

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'in-progress'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['done']
            });
