<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chintu">
  <title>Chintu — Send Idea</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 40px; }

    #record-btn {
      width: 120px;
      height: 120px;
      border-radius: 60px;
      border: none;
      background: #1a1a1a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      transition: all 0.2s;
      box-shadow: 0 0 0 0 rgba(255, 59, 48, 0);
    }

    #record-btn.recording {
      background: #ff3b30;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.5); }
      70%  { box-shadow: 0 0 0 20px rgba(255, 59, 48, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
      min-height: 20px;
    }

    #transcript-box {
      margin-top: 24px;
      width: 100%;
      max-width: 480px;
    }

    #title-input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-size: 16px;
      margin-bottom: 10px;
      outline: none;
    }

    #title-input::placeholder { color: #555; }

    #transcript {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-size: 16px;
      min-height: 120px;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    #transcript::placeholder { color: #555; }

    #send-btn {
      margin-top: 12px;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: #0a84ff;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #send-btn:disabled { opacity: 0.4; cursor: default; }
    #send-btn:not(:disabled):active { opacity: 0.8; }

    #result {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      width: 100%;
      max-width: 480px;
    }

    #result.success { background: #1a3a1a; border: 1px solid #2d6a2d; color: #4caf50; }
    #result.error   { background: #3a1a1a; border: 1px solid #6a2d2d; color: #f44336; }

    .config-hint {
      position: fixed;
      bottom: 20px;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>🧠 Chintu</h1>
  <p class="subtitle">Dictate your idea. I'll build it.</p>

  <button id="record-btn" onclick="toggleRecording()">🎙️</button>
  <p id="status">Tap to speak your idea</p>

  <div id="transcript-box">
    <input id="title-input" type="text" placeholder="Idea title (auto-filled or type it)" />
    <textarea id="transcript" placeholder="Your idea will appear here... or type it manually"></textarea>
    <button id="send-btn" onclick="sendIdea()" disabled>Send to Chintu →</button>
  </div>

  <div id="result"></div>
  <p class="config-hint">Add to Home Screen for best experience</p>

  <script>
    // ── Config ──────────────────────────────────────────────────────────────
    // Replace these with your actual values
    const GITHUB_TOKEN = localStorage.getItem('gh_token') || promptForToken();
    const GITHUB_OWNER = 'jung-life';
    const GITHUB_REPO  = 'gonull-app';
    const ISSUE_LABEL  = 'ai-task';

    function promptForToken() {
      const t = prompt('Enter your GitHub Personal Access Token (stored locally, never sent anywhere except GitHub):');
      if (t) localStorage.setItem('gh_token', t);
      return t;
    }

    // ── Voice Recognition ───────────────────────────────────────────────────
    let recognition = null;
    let isRecording = false;

    function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    function startRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        setStatus('Voice not supported in this browser — type your idea instead');
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('record-btn').classList.add('recording');
        document.getElementById('record-btn').textContent = '⏹️';
        setStatus('Listening... speak your idea');
      };

      recognition.onresult = (event) => {
        let final = '';
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) final += t;
          else interim += t;
        }
        const current = document.getElementById('transcript').value;
        if (final) {
          document.getElementById('transcript').value = (current + ' ' + final).trim();
          autoFillTitle();
        }
        setStatus(interim ? `"${interim}"` : 'Keep talking...');
        updateSendBtn();
      };

      recognition.onerror = (e) => {
        setStatus(`Error: ${e.error}. Try typing instead.`);
        stopRecording();
      };

      recognition.onend = () => {
        if (isRecording) recognition.start(); // keep going
      };

      recognition.start();
    }

    function stopRecording() {
      isRecording = false;
      if (recognition) recognition.stop();
      document.getElementById('record-btn').classList.remove('recording');
      document.getElementById('record-btn').textContent = '🎙️';
      setStatus('Tap to record again, or edit and send');
    }

    function autoFillTitle() {
      const text = document.getElementById('transcript').value.trim();
      if (!document.getElementById('title-input').value && text.length > 0) {
        // Use first sentence or first 60 chars as title
        const firstSentence = text.split(/[.!?]/)[0].trim().slice(0, 60);
        document.getElementById('title-input').value = firstSentence;
      }
    }

    function updateSendBtn() {
      const hasContent = document.getElementById('transcript').value.trim().length > 0;
      document.getElementById('send-btn').disabled = !hasContent;
    }

    document.getElementById('transcript').addEventListener('input', updateSendBtn);
    document.getElementById('title-input').addEventListener('input', updateSendBtn);

    // ── Send to GitHub ──────────────────────────────────────────────────────
    async function sendIdea() {
      const title = document.getElementById('title-input').value.trim()
                 || document.getElementById('transcript').value.trim().slice(0, 60);
      const body  = document.getElementById('transcript').value.trim();

      if (!body) return;

      document.getElementById('send-btn').disabled = true;
      document.getElementById('send-btn').textContent = 'Sending...';

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues`, {
          method: 'POST',
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            title,
            body: `## Idea\n${body}\n\n---\n*Sent from Chintu mobile app*`,
            labels: [ISSUE_LABEL]
          })
        });

        const issue = await res.json();

        if (res.ok) {
          showResult('success', `✅ Idea sent! Chintu is working on it.\n\nTrack progress: ${issue.html_url}`);
          document.getElementById('transcript').value = '';
          document.getElementById('title-input').value = '';
        } else {
          showResult('error', `❌ Failed: ${issue.message}`);
        }
      } catch (e) {
        showResult('error', `❌ Network error: ${e.message}`);
      }

      document.getElementById('send-btn').disabled = false;
      document.getElementById('send-btn').textContent = 'Send to Chintu →';
    }

    function showResult(type, msg) {
      const el = document.getElementById('result');
      el.className = type;
      el.textContent = msg;
      el.style.display = 'block';
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }
  </script>
</body>
</html>
